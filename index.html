<!DOCTYPE html>

    <style>

<body class="flex items-center justify-center p-4 min-h-screen text-slate-800">

    <script>
        // Web Audio API for Sound Effects
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playCorrect() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            },
            playWrong() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            },
            playClick() {
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        };

        const quizData = [
            {
                question: "Apa kepanjangan dari singkatan 'AI' dalam dunia teknologi?",
                options: ["Artificial Intelligence", "Automated Information", "Advanced Integration", "Algorithm Interface"],
                answer: 0,
                explanation: "AI singkatan dari Artificial Intelligence (Kecerdasan Buatan), bidang ilmu komputer yang fokus membuat sistem cerdas yang mampu meniru cara berpikir manusia."
            },
            {
                question: "Model AI seperti ChatGPT atau Gemini yang dilatih dengan miliaran teks termasuk dalam kategori...",
                options: ["Large Language Model (LLM)", "Linear Logic Machine", "Low Latency Matrix", "Language Processing System"],
                answer: 0,
                explanation: "LLM (Large Language Model) adalah model deep learning masif yang memproses dan menghasilkan teks bahasa manusia dengan akurasi tinggi."
            },
            {
                question: "Pengujian terkenal untuk menguji apakah suatu kecerdasan AI tidak terbedakan dari manusia dinamakan...",
                options: ["Turing Test", "Voight-Kampff Test", "Captcha Protocol", "Binary Intelligence Test"],
                answer: 0,
                explanation: "Turing Test digagas oleh Alan Turing pada 1950 untuk mengevaluasi apakah perilaku kecerdasan mesin dapat menyamai manusia."
            },
            {
                question: "Cabang AI yang berfokus agar komputer mampu memahami dan mengolah bahasa alami manusia disebut...",
                options: ["Natural Language Processing (NLP)", "Computer Vision (CV)", "Neural Data Mining", "Speech Analytics"],
                answer: 0,
                explanation: "NLP (Natural Language Processing) memungkinkan mesin menganalisis, memahami, dan memproduksi bahasa manusia."
            },
            {
                question: "Fenomena ketika AI generatif memberikan jawaban yang salah namun disajikan dengan sangat meyakinkan disebut...",
                options: ["Hallucination (Halusinasi)", "System Glitch", "Data Leakage", "Overfitting"],
                answer: 0,
                explanation: "Halusinasi AI adalah respons percaya diri dari AI yang tidak didukung oleh data pelatihan yang nyata atau faktual."
            },
            {
                question: "Teknik Machine Learning yang arsitekturnya terinspirasi oleh susunan neuron otak manusia adalah...",
                options: ["Artificial Neural Network (ANN)", "Decision Tree", "Support Vector Machine", "Genetic Algorithm"],
                answer: 0,
                explanation: "ANN (Jaringan Saraf Tiruan) meniru struktur dan cara kerja neuron otak manusia dalam mengenali pola kompleks."
            },
            {
                question: "Kecerdasan Buatan hipotetis yang memiliki kemampuan intelektual setara atau melebihi manusia di segala bidang disebut...",
                options: ["AGI (Artificial General Intelligence)", "ANI (Artificial Narrow Intelligence)", "ASI (Automated Super Interface)", "API (Artificial Programmable Intelligence)"],
                answer: 0,
                explanation: "AGI merujuk pada AI umum yang dapat mempelajari dan menyelesaikan tugas intelektual apa pun seperti halnya manusia."
            },
            {
                question: "Seni merancang instruksi atau perintah yang efektif agar AI generatif memberikan respons presisi dinamakan...",
                options: ["Prompt Engineering", "Code Refactoring", "Data Scraping", "Algorithm Tuning"],
                answer: 0,
                explanation: "Prompt Engineering adalah teknik merancang kalimat masukan (prompt) agar model AI menghasilkan output yang optimal."
            },
            {
                question: "Teknologi AI yang memungkinkan komputer mengenali dan menganalisis objek visual dari foto/video adalah...",
                options: ["Computer Vision", "Optical Intelligence", "Visual Big Data", "Graphic Learning"],
                answer: 0,
                explanation: "Computer Vision memungkinkan sistem komputer mengekstrak informasi berharga dari gambar atau video digital."
            },
            {
                question: "Unit data terkecil dalam komputasi kuantum yang memanfaatkan prinsip superposisi dinamakan...",
                options: ["Qubit", "Byte", "Pixel", "KiloBit"],
                answer: 0,
                explanation: "Qubit (Quantum Bit) adalah unit dasar informasi kuantum yang bisa berada pada keadaan 0, 1, atau keduanya sekaligus."
            },
            {
                question: "Jaringan perangkat fisik seperti lampu pintar dan thermostat yang saling terhubung ke internet dinamakan...",
                options: ["Internet of Things (IoT)", "Cloud Mesh", "Smart Grid System", "Cyber-Physical Link"],
                answer: 0,
                explanation: "IoT (Internet of Things) adalah konsep terhubungnya objek fisik ke internet untuk pertukaran data secara cerdas."
            },
            {
                question: "Model AI yang dilatih khusus untuk membuat konten baru seperti gambar, musik, teks, atau kode disebut...",
                options: ["Generative AI", "Predictive AI", "Reactive AI", "Analytical AI"],
                answer: 0,
                explanation: "Generative AI berfokus menciptakan karya atau konten sintetis baru berbasis pola dari data yang dipelajarinya."
            },
            {
                question: "Sensor berbasis sinar laser yang digunakan mobil otonom (tanpa pengemudi) untuk mengukur jarak sekitar adalah...",
                options: ["LiDAR", "Radar Sonar", "Infrared Grid", "GPS Tracker"],
                answer: 0,
                explanation: "LiDAR (Light Detection and Ranging) memancarkan laser untuk membuat peta 3D lingkungan sekitar kendaraan secara real-time."
            },
            {
                question: "Metode latihan AI di mana model diberi masukan data beserta kunci jawaban (label) yang benar dinamakan...",
                options: ["Supervised Learning", "Unsupervised Learning", "Reinforcement Learning", "Zero-Shot Learning"],
                answer: 0,
                explanation: "Supervised Learning (Pembelajaran Terawasi) menggunakan kumpulan data terlabel agar AI belajar mengenali pola yang tepat."
            },
            {
                question: "Sistem keamanan biometrik modern yang memanfaatkan AI untuk memverifikasi struktur wajah penggunanya dinamakan...",
                options: ["Facial Recognition", "Fingerprint Matching", "Voice Synthesizer", "Retina Projection"],
                answer: 0,
                explanation: "Facial Recognition memanfaatkan algoritma AI vision untuk mengidentifikasi dan memverifikasi identitas seseorang melalui fitur wajah."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let userAnswers = [];
        let isAnswered = false;
        let shuffledQuestions = [];

        function prepareQuestions() {
            shuffledQuestions = quizData.map((q, idx) => {
                const optionsWithOrig = q.options.map((opt, i) => ({
                    text: opt,
                    isCorrect: i === q.answer
                }));
                
                for (let i = optionsWithOrig.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithOrig[i], optionsWithOrig[j]] = [optionsWithOrig[j], optionsWithOrig[i]];
                }

                return {
                    question: q.question,
                    options: optionsWithOrig,
                    explanation: q.explanation,
                    originalIndex: idx
                };
            });
        }

        const appEl = document.getElementById('app');

        function renderWelcome() {
            appEl.innerHTML = `
                <div class="text-center py-4">
                    <div class="w-24 h-24 bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 rounded-3xl mx-auto flex items-center justify-center shadow-lg transform -rotate-6 mb-6">
                        <i data-lucide="cpu" class="w-12 h-12 text-white animate-bounce-short"></i>
                    </div>

                    <h2 class="text-2xl font-black text-slate-800 mb-2">Siap Uji Wawasan AI?</h2>
                    <p class="text-slate-600 text-sm mb-6 leading-relaxed">
                        Tunjukkan seberapa canggih pemahamanmu seputar teknologi masa depan, AI, dan inovasi digital terkini!
                    </p>

                    <div class="grid grid-cols-3 gap-2 mb-8 text-center">
                        <div class="bg-purple-100 p-2.5 rounded-2xl">
                            <span class="block text-purple-700 font-extrabold text-lg">15</span>
                            <span class="text-[10px] text-purple-600 font-bold uppercase">Soal</span>
                        </div>
                        <div class="bg-pink-100 p-2.5 rounded-2xl">
                            <span class="block text-pink-700 font-extrabold text-lg">Fun</span>
                            <span class="text-[10px] text-pink-600 font-bold uppercase">Tampilan</span>
                        </div>
                        <div class="bg-indigo-100 p-2.5 rounded-2xl">
                            <span class="block text-indigo-700 font-extrabold text-lg">+EFX</span>
                            <span class="text-[10px] text-indigo-600 font-bold uppercase">Audio</span>
                        </div>
                    </div>

                    <button id="start-btn" class="w-full btn-gradient text-white font-extrabold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base tracking-wide">
                        <span>MULAI KUIS SEKARANG</span>
                        <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </button>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('start-btn').addEventListener('click', () => {
                AudioFX.playClick();
                prepareQuestions();
                currentQuestion = 0;
                score = 0;
                userAnswers = [];
                renderQuiz();
            });
        }

        function renderQuiz() {
            isAnswered = false;
            const q = shuffledQuestions[currentQuestion];
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;

            appEl.innerHTML = `
                <div class="mb-5">
                    <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-2">
                        <span class="flex items-center gap-1 text-purple-600">
                            <i data-lucide="help-circle" class="w-4 h-4"></i>
                            Pertanyaan ${currentQuestion + 1} dari 15
                        </span>
                        <span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">${Math.round(progress)}%</span>
                    </div>
                    <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200">
                        <div class="h-full bg-gradient-to-r from-pink-500 to-purple-600 rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-lg font-extrabold text-slate-800 leading-snug">
                        ${q.question}
                    </h3>
                </div>

                <div class="space-y-3 mb-6" id="options-container">
                    ${q.options.map((opt, idx) => `
                        <button data-index="${idx}" class="option-btn w-full option-card bg-slate-50 hover:bg-purple-50 border-2 border-slate-200 hover:border-purple-300 p-4 rounded-2xl font-bold text-slate-700 text-left flex items-center justify-between group">
                            <span class="text-sm pr-2">${opt.text}</span>
                            <div class="w-7 h-7 rounded-full bg-white border-2 border-slate-300 flex items-center justify-center shrink-0 group-hover:border-purple-500">
                                <span class="text-xs text-slate-400 group-hover:text-purple-600 font-black">${String.fromCharCode(65 + idx)}</span>
                            </div>
                        </button>
                    `).join('')}
                </div>

                <div id="explanation-box" class="hidden mb-6 p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 leading-relaxed">
                    <div class="font-extrabold mb-1 flex items-center gap-1.5 text-amber-700 text-sm">
                        <i data-lucide="lightbulb" class="w-4 h-4"></i> Penjelasan:
                    </div>
                    <span id="explanation-text">${q.explanation}</span>
                </div>

                <button id="next-btn" class="hidden w-full btn-gradient text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-md flex items-center justify-center gap-2">
                    <span>${currentQuestion < shuffledQuestions.length - 1 ? 'PERTANYAAN SELANJUTNYA' : 'LIHAT HASIL AKHIR'}</span>
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            `;

            lucide.createIcons();

            const optionBtns = document.querySelectorAll('.option-btn');
            optionBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (isAnswered) return;
                    isAnswered = true;

                    const selectedIdx = parseInt(btn.getAttribute('data-index'));
                    const isCorrect = q.options[selectedIdx].isCorrect;

                    userAnswers.push({
                        question: q.question,
                        selectedText: q.options[selectedIdx].text,
                        correctText: q.options.find(o => o.isCorrect).text,
                        isCorrect: isCorrect,
                        explanation: q.explanation
                    });

                    optionBtns.forEach((b, i) => {
                        b.disabled = true;
                        b.classList.remove('hover:bg-purple-50', 'hover:border-purple-300');
                        
                        if (q.options[i].isCorrect) {
                            b.classList.remove('bg-slate-50', 'border-slate-200');
                            b.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                            b.querySelector('div').className = 'w-7 h-7 rounded-full bg-emerald-500 text-white flex items-center justify-center shrink-0 font-bold text-xs';
                            b.querySelector('div').innerHTML = '✓';
                        } else if (i === selectedIdx && !isCorrect) {
                            b.classList.remove('bg-slate-50', 'border-slate-200');
                            b.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900');
                            b.querySelector('div').className = 'w-7 h-7 rounded-full bg-rose-500 text-white flex items-center justify-center shrink-0 font-bold text-xs';
                            b.querySelector('div').innerHTML = '✕';
                        } else {
                            b.classList.add('opacity-50');
                        }
                    });

                    if (isCorrect) {
                        score++;
                        AudioFX.playCorrect();
                    } else {
                        AudioFX.playWrong();
                    }

                    document.getElementById('explanation-box').classList.remove('hidden');
                    const nextBtn = document.getElementById('next-btn');
                    nextBtn.classList.remove('hidden');
                    nextBtn.scrollIntoView({ behavior: 'smooth', block: 'end' });
                });
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                AudioFX.playClick();
                if (currentQuestion < shuffledQuestions.length - 1) {
                    currentQuestion++;
                    renderQuiz();
                } else {
                    renderResult();
                }
            });
        }

        function renderResult() {
            const percentage = Math.round((score / shuffledQuestions.length) * 100);
            
            if (percentage >= 60) {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            let badgeTitle = "";
            let badgeClass = "";
            if (percentage === 100) {
                badgeTitle = "👑 AI Mastermind";
                badgeClass = "bg-amber-100 text-amber-800 border-amber-300";
            } else if (percentage >= 75) {
                badgeTitle = "🚀 Tech Expert";
                badgeClass = "bg-purple-100 text-purple-800 border-purple-300";
            } else if (percentage >= 50) {
                badgeTitle = "⚡ Tech Explorer";
                badgeClass = "bg-blue-100 text-blue-800 border-blue-300";
            } else {
                badgeTitle = "🌱 Beginner Learner";
                badgeClass = "bg-slate-100 text-slate-800 border-slate-300";
            }

            appEl.innerHTML = `
                <div class="text-center py-2">
                    <div class="inline-block px-4 py-1.5 rounded-full border text-xs font-black uppercase mb-4 ${badgeClass}">
                        ${badgeTitle}
                    </div>

                    <h2 class="text-2xl font-black text-slate-800 mb-1">Hasil Akhir Kuis</h2>
                    <p class="text-xs text-slate-500 mb-6">Berikut ringkasan performa kamu!</p>

                    <div class="w-36 h-36 mx-auto rounded-full bg-gradient-to-tr from-pink-500 via-purple-600 to-indigo-600 p-1.5 shadow-xl mb-6">
                        <div class="w-full h-full bg-white rounded-full flex flex-col items-center justify-center">
                            <span class="text-4xl font-black text-slate-800">${score}</span>
                            <span class="text-xs font-bold text-slate-400">dari 15 Benar</span>
                        </div>
                    </div>

                    <div class="mb-6">
                        <span class="text-3xl font-extrabold gradient-text">${percentage}%</span>
                        <span class="block text-xs font-semibold text-slate-500 mt-1">Akurasi Jawaban</span>
                    </div>

                    <div class="space-y-3">
                        <button id="review-btn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-extrabold py-3.5 px-6 rounded-2xl flex items-center justify-center gap-2 text-sm transition-colors">
                            <i data-lucide="file-text" class="w-4 h-4 text-purple-600"></i>
                            <span>PEMBAHASAN JAWABAN</span>
                        </button>

                        <button id="restart-btn" class="w-full btn-gradient text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-md flex items-center justify-center gap-2 text-sm">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                            <span>MAIN AGAIN</span>
                        </button>
                    </div>
                </div>
            `;

            lucide.createIcons();

            document.getElementById('restart-btn').addEventListener('click', () => {
                AudioFX.playClick();
                prepareQuestions();
                currentQuestion = 0;
                score = 0;
                userAnswers = [];
                renderQuiz();
            });

            document.getElementById('review-btn').addEventListener('click', () => {
                AudioFX.playClick();
                renderReview();
            });
        }

        function renderReview() {
            appEl.innerHTML = `
                <div class="mb-4 flex items-center justify-between">
                    <h3 class="text-lg font-black text-slate-800 flex items-center gap-2">
                        <i data-lucide="book-open" class="w-5 h-5 text-purple-600"></i>
                        Pembahasan Jawaban
                    </h3>
                    <span class="text-xs font-bold bg-purple-100 text-purple-700 px-2.5 py-1 rounded-full">15 Soal</span>
                </div>

                <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1 mb-4">
                    ${userAnswers.map((ans, idx) => `
                        <div class="p-4 rounded-2xl border ${ans.isCorrect ? 'bg-emerald-50/60 border-emerald-200' : 'bg-rose-50/60 border-rose-200'}">
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-bold text-xs ${ans.isCorrect ? 'text-emerald-700' : 'text-rose-700'}">
                                    No. ${idx + 1} • ${ans.isCorrect ? 'BENAR ✓' : 'SALAH ✕'}
                                </span>
                            </div>
                            <p class="font-extrabold text-sm text-slate-800 mb-2">${ans.question}</p>
                            
                            <div class="text-xs space-y-1 mb-3">
                                ${!ans.isCorrect ? `<p class="text-rose-700"><strong>Jawabanmu:</strong> ${ans.selectedText}</p>` : ''}
                                <p class="text-emerald-800"><strong>Kunci Jawaban:</strong> ${ans.correctText}</p>
                            </div>

                            <div class="bg-white/80 p-2.5 rounded-xl border border-slate-200 text-[11px] text-slate-600 leading-relaxed">
                                <span class="font-bold text-slate-700 block mb-0.5">💡 Penjelasan:</span>
                                ${ans.explanation}
                            </div>
                        </div>
                    `).join('')}
